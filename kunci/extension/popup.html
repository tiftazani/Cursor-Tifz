<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Kunci</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="8" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 12h10m-3-3v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <div>
          <h1>Kunci</h1>
          <p id="status" class="muted">Memuat…</p>
        </div>
      </header>
      <form id="unlock" hidden>
        <input
          id="password"
          name="kunci-master-password"
          type="password"
          placeholder="Kata sandi induk"
          autocomplete="off"
          data-lpignore="true"
          data-1p-ignore="true"
        />
        <button type="submit" id="unlock-btn">Buka</button>
      </form>
      <div id="app" hidden>
        <input id="search" type="search" placeholder="Cari…" />
        <ul id="list"></ul>
      </div>
      <p id="error" class="error"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
