# IMO Almanac — GitHub Pages
name: Deploy IMO Almanac

on:
  push:
    paths:
      - "imo-factory/**"
      - ".github/workflows/imo-pages.yml"
    branches:
      - main
      - cursor/imo-factory-site-eb4c

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: imo-factory
      - id: deployment
        uses: actions/deploy-pages@v4
