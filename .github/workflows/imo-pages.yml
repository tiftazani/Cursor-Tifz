name: Deploy IMO dashboard to Pages

on:
  push:
    branches:
      - main
      - cursor/imo-whatsapp-analytics-eb4c
    paths:
      - public/imo.html
      - .github/workflows/imo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static dashboard
        run: |
          mkdir -p _site
          cp public/imo.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
