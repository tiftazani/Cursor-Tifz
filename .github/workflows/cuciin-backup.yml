name: Cuciin D1 backup verification

on:
  workflow_dispatch:
  schedule:
    # Tiap hari 20:00 UTC = 03:00 WIB, saat pemakaian cabang paling sepi.
    - cron: "0 20 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laundry-ops/cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laundry-ops/cloudflare/package-lock.json
      - run: npm ci
      - name: Export and encrypt D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/backup-d1.sh
      - name: Verify encrypted backup can be restored
        env:
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/verify-backup.sh backups/*.sql.enc

      # Repo ini publik, jadi artifact GitHub akan menaruh salinan database
      # produksi di tempat yang bisa diunduh siapa pun yang punya tautannya.
      # R2 tidak dipakai karena mengaktifkannya menuntut kartu kredit.
      # Service account Google dipakai karena gratis tanpa kartu, dan folder
      # itu hanya dibagikan ke email Owner sehingga salinannya privat.
      - name: Siapkan kredensial service account Google
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          : "${GDRIVE_SA_JSON:?GDRIVE_SA_JSON belum tersedia}"
          mkdir -p "$HOME/.config/cuciin"
          printf '%s' "$GDRIVE_SA_JSON" > "$HOME/.config/cuciin/gdrive-sa.json"
          chmod 600 "$HOME/.config/cuciin/gdrive-sa.json"
          python3 -c "import json,sys; d=json.load(open('$HOME/.config/cuciin/gdrive-sa.json')); print('service account:', d['client_email'])"

      - name: Unggah backup terenkripsi ke Google Drive
        env:
          CUCIIN_GDRIVE_FOLDER: ${{ secrets.CUCIIN_GDRIVE_FOLDER }}
          CUCIIN_GDRIVE_SA: /home/runner/.config/cuciin/gdrive-sa.json
        run: python3 scripts/unggah-ke-drive.py

      - name: Buktikan unggahan bisa dibaca kembali dan checksumnya cocok
        env:
          CUCIIN_GDRIVE_FOLDER: ${{ secrets.CUCIIN_GDRIVE_FOLDER }}
          CUCIIN_GDRIVE_SA: /home/runner/.config/cuciin/gdrive-sa.json
        run: python3 scripts/unggah-ke-drive.py --verifikasi
