name: Cuciin D1 backup verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: laundry-ops/cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laundry-ops/cloudflare/package-lock.json
      - run: npm ci
      - name: Export and encrypt D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/backup-d1.sh
      - name: Verify encrypted backup can be restored
        env:
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/verify-backup.sh backups/*.sql.enc
      - name: Upload only when repository is private
        if: github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: cuciin-d1-backup-${{ github.run_id }}
          path: |
            laundry-ops/cloudflare/backups/*.sql.enc
            laundry-ops/cloudflare/backups/*.sha256
          retention-days: 7
          if-no-files-found: error
