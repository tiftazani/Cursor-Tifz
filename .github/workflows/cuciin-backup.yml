name: Cuciin D1 backup verification

# Backup ini memvalidasi database produksi tiap hari: export penuh, enkripsi,
# lalu restore ke SQLite untuk membuktikan isinya utuh. Kalau salah satu
# langkah gagal, Owner dapat notifikasi GitHub.
#
# Salinan backup TIDAK disimpan di sini. Semua penyimpanan gratis yang bisa
# dipakai tanpa kartu kredit sudah diuji dan mentok di batas penyedianya:
#   - Cloudflare R2        -> wajib kartu kredit (code 10042)
#   - Google Drive (SA)    -> service account berkuota 0, Google melarangnya
#   - Google Drive (OAuth) -> butuh OAuth client, mentok di brand tanpa billing
#   - GitHub artifact      -> hanya tersimpan kalau repo privat
# Salinan cadangan manual disimpan Owner di:
#   ~/Documents/ChatGPT/Laundry/firebase-migration/backup-d1/
# Lihat laundry-ops/AGENT_STATUS.md bagian "Backup" untuk keadaan terbaru.

on:
  workflow_dispatch:
  schedule:
    # Tiap hari 20:00 UTC = 03:00 WIB, saat pemakaian cabang paling sepi.
    - cron: "0 20 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laundry-ops/cloudflare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laundry-ops/cloudflare/package-lock.json

      - run: npm ci

      - name: Export and encrypt D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/backup-d1.sh

      - name: Verify encrypted backup can be restored
        env:
          CUCIIN_BACKUP_PASSPHRASE: ${{ secrets.CUCIIN_BACKUP_PASSPHRASE }}
        run: ./scripts/verify-backup.sh backups/*.sql.enc

      - name: Laporkan hasil
        if: always()
        run: |
          set -euo pipefail
          for b in backups/*.sql.enc; do
            [ -f "$b" ] || continue
            echo "berkas : $b"
            echo "ukuran : $(stat -c%s "$b") byte"
            echo "sha256 : $(sha256sum "$b" | cut -d' ' -f1)"
          done
