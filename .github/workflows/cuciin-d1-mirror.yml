name: Cuciin D1 database mirror

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC = 01:00 WIB. Sekali sehari, di luar jam operasional cabang,
    # karena wrangler d1 export mengunci database produksi sesaat.
    - cron: "0 18 * * *"

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan mirroring database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: laundry-ops/cloudflare
        run: |
          npm ci --ignore-scripts || npm install --no-audit --no-fund
          bash scripts/mirror-d1.sh
