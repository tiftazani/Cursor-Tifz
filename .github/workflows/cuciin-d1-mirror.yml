name: Cuciin D1 database mirror

# Menyalin database produksi (cuciin-db) ke database cadangan (cuciin-backup-db)
# sekali sehari. Ini melengkapi Time Travel, bukan menggantikannya: Time Travel
# menutup 7 hari terakhir dengan gratis dan tanpa mengunci database, sedangkan
# mirror ini menyimpan riwayat lebih panjang dan tetap ada bila akun Cloudflare
# hilang.
#
# Dijalankan 01:00 WIB karena `wrangler d1 export` mengunci database produksi
# sesaat. Jangan naikkan frekuensinya ke jam operasional cabang.

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC = 01:00 WIB keesokan harinya.
    - cron: "0 18 * * *"

permissions:
  contents: read

# Dua run bersamaan akan saling mengunci database produksi dan menghasilkan
# impor yang tidak konsisten. Yang berikutnya menunggu, bukan berjalan paralel.
concurrency:
  group: cuciin-d1-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: laundry-ops/cloudflare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # wrangler 4.x menolak berjalan di bawah Node 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: laundry-ops/cloudflare/package-lock.json

      - run: npm ci

      - name: Export produksi lalu impor ke database cadangan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/mirror-d1.sh

      - name: Laporkan hasil
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Keluaran langkah ini harus bisa dibaca cepat. Pada 25 Sep 2026 mirror
          # gagal dan cadangan menjadi kosong, tetapi laporannya cuma menulis
          # "tidak terbaca" di antara baris lain. Sekarang keadaan itu ditandai
          # jelas dan diakhiri dengan keluar kode 1.
          RUSAK=0
          for db in cuciin-db cuciin-backup-db; do
            n="$(npx wrangler d1 execute "$db" --remote --json \
              --command="SELECT count(*) AS n FROM staff;" 2>/dev/null \
              | grep -oE '"n": *[0-9]+' | grep -oE '[0-9]+' || true)"
            echo "$db staff: ${n:-TIDAK TERBACA}"
            if [ -z "$n" ]; then
              echo "  ^^ PERINGATAN: tabel staff tidak terbaca di $db. Cadangan kosong berarti tidak ada salinan data produksi." >&2
              RUSAK=1
            fi
          done
          if [ "$RUSAK" = "1" ]; then
            echo "GALAT: ada database yang tidak bisa dibaca; periksa log langkah sebelumnya." >&2
            exit 1
          fi
