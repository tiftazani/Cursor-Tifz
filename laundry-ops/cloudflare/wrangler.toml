name = "cuciin-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "cuciin-db"
database_id = "7152b13e-f23a-4576-a6bc-f38d67ac2146"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
# Masa peralihan identitas aplikasi: APK lama memakai project lama, APK baru
# (paket com.cuciin.laundryops) memakai project baru. Keduanya diterima sampai
# seluruh perangkat berpindah, lalu project lama boleh dihapus dari daftar ini.
FIREBASE_PROJECT_IDS = "cuciin-ops,cuciin-ops-tiftazani"

[observability]
enabled = true
head_sampling_rate = 1
